text = "Read back by the operator from Statements/RH_dbn_selberg_newman_sharp.lean and RHDefs.lean (rendering drafted by the authoring session, checked by me). The theorem quantifies over every S of the structure DBNSelberg.SelbergSharp, the extended Selberg class: Dirichlet coefficients a with a 1 = 1, a second nonzero coefficient, absolute convergence for Re s > 1; a meromorphic continuation F equal to the Dirichlet series for Re s > 1 such that (s-1)^m F extends to an entire function; Gamma data Q > 0, lam_j > 0, Re mu_j >= 0, sum lam_j > 0; a root number omega of norm 1; the functional equation Q^s prod Gamma(lam_j s + mu_j) F(s) = omega times the conjugate of the same expression at 1 - conj s, for 0 < Re s < 1; and finite order of (s(s-1))^m Q^s prod Gamma F on Re s >= 1/2. For every such S and every real t < 0 it concludes that there is a complex z with S.sharpFlow t z = 0 and z.im not equal to 0, where sharpFlow t is the Gaussian convolution of the glued completed function xi (the right-half-plane expression through the entire extension G, reflected by the functional equation on Re s < 1/2) evaluated at 1/2 + i(z+w)/2. That is Newman's conjecture Lambda_S >= 0 for the class itself; the one simplification is that finite order is assumed for (s(s-1))^m Phi rather than for (s-1)^m F alone."
