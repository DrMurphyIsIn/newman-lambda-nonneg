title = "Newman's conjecture for the extended Selberg class (Dobner 2020, Theorem 1 in the form the dbn island states it): for every ExtSelbergData F (coefficients absolutely convergent on Re s > 1, a(1) = 1, not a single term; Gamma factor P(v) Q^v prod Gamma(lam_j v + mu_j) with lam_j > 0, Re mu_j >= 0, sum lam_j > 0; entire completed function Xi equal to sum a(n) gamma_F(s) n^-s on Re s > 1 and bounded on horizontal strips) and every t < 0, the Gaussian-convolution heat flow F.flow t has a NON-REAL zero, i.e. Lambda_F >= 0. The structure's fields are the hypotheses; for an honest S^# element the entire-continuation and strip-bound fields are theorems (Phragmen-Lindelof + Stirling) NOT proved here. zeta is an instance (DBNSelbergZeta) and recovers RH_dbn_newman as the control. Lambda_F = 0 (generalized RH) is NOT touched. conjecture1_proved = False"
