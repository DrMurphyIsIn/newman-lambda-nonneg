name = "DBN"
# Route C (de Bruijn-Newman) foundations island -- RH_ROUTES_ROADMAP_2026-09-16.md section 4,
# milestones C2 (DBNDefs) / C3 / C4. Same toolchain and Mathlib pin as li_positivity
# (LiCriterion -> Mathlib de5ce8a9 / Lean v4.34.0-rc1) so `LiCriterion.riemannXi` is the shared
# xi vocabulary across the two islands. AxiomGuardDBN is a defaultTarget so bare `lake build`
# compiles the guard and, transitively, every module it imports (cf. the li_positivity lakefile
# rationale, #448/#451).
defaultTargets = ["DBNDefs", "DBNRealZerosIff", "DBNXiRiemann", "DBNGKernel", "DBNXiCos", "DBNXiIBP", "DBNXi", "DBNRealZerosIffFinal", "DBNStrip", "DBNStep", "DBNStepControls", "DBNHurwitz", "DBNHeatApprox", "DBNDeBruijnReduction", "DBNHadamardCount", "DBNHadamardProduct", "DBNHadamardMean", "DBNHadamardLinear", "DBNHadamard", "DBNHadamardApprox", "DBNM1Approx", "DBNM1Parametric", "DBNM1RHIff", "DBNM1Controls", "DBNM4P15Defs", "DBNM4LocalStep", "DBNM4HeatUniform", "DBNM4P15Criterion", "M6gapEMZeta", "M6gapEMZetaComplex", "M6gapEMZetaTail", "M6gapZetaEMSum", "M6gapHeightFloorCheck", "M6gapHeightFloorTrig", "M6gapHeightFloorEM", "M6gapHeightFloorBoxes", "M6gapZetaZeroConfinement", "M6gapDlvpZetaSymmetry", "M6gapHeightFloor", "M6gapImAxis", "M6gapP15ZeroFree", "DBNM5Alpha", "DBNM5Target", "DBNP15Wired", "DBNZeroFreeHalfplane", "DBNBohr", "DBNFtZero", "DBNFtZeroHigh", "DBNStirling", "DBNGaussConv", "DBNSaddleAlg", "DBNSaddleBounds", "DBNSaddleSum", "DBNTheorem4", "DBNNewman", "DBNTheorem4Effective", "DBNSelbergData", "DBNSelbergGauss", "DBNSelbergSaddleAlg", "DBNSelbergSaddleBounds", "DBNSelbergFtZero", "DBNSelbergSaddleSum", "DBNSelbergNewman", "DBNSelbergZeta", "DBNGammaVertical", "DBNSelbergSharp", "DBNSelbergSharpXi", "DBNSelbergSharpStrip", "DBNSelbergSharpZeta", "AxiomGuardDBN"]

